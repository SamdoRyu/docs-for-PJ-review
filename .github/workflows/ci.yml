# Pull Request · develop · main 자동 검증.
#
# docs/PROJECT_COMMANDS.md 의 "PR 전에 반드시" 를 그대로 옮긴다 — lint · test · build.
# 각 명령을 별도 step 으로 둬서 실패한 단계가 GitHub UI 에서 바로 보이게 한다.
#
# `push` 도 보는 이유 — PR 마다 CI 가 통과해도, 같은 파일의 다른 곳을 고친 두 PR 이 conflict
# 없이 합쳐지면 **합친 결과만** 깨질 수 있다. merge 된 결과를 develop · main 에서 한 번 더 돌려
# 그 자리에서 잡는다.
#
# **secret · production DB 를 쓰지 않는다.** env 를 하나도 주입하지 않아도 전부 통과해야 한다
# (환경 변수 가이드 > 환경별 설정: CI 는 env 없이 통과).
#   - 서버의 필수 env 검사는 빌드가 아니라 서버가 실제로 뜰 때만 돌아야 한다.
#   - 테스트는 core 의 순수 규칙과 fake 어댑터로만 돈다. GitHub API 를 부르지 않는다.
# 이 전제가 깨지면(빌드가 env 를 요구하기 시작하면) placeholder 를 넣지 말고 팀에 보고한다.

name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# 같은 ref 에 연속으로 push 하면 이전 run 을 취소한다 — 마지막 commit 의 결과만 의미가 있다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN 은 checkout 에 필요한 읽기 권한만 갖는다.
permissions:
  contents: read

jobs:
  verify:
    name: lint · test · build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

