name: Bug
description: 재현 가능한 잘못된 동작
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: requirement
    attributes:
      label: 요구사항 ID
      description: 요구사항 정의서의 ID. 여러 개면 쉼표로 구분합니다.
      placeholder: "예: FR-GH-03, NFR-10"
    validations:
      required: false

  - type: textarea
    id: summary
    attributes:
      label: 현상
      description: 실제로 어떤 문제가 발생하는지 작성해주세요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 환경
      placeholder: "Chrome / 로컬 / 시범 서버"
    validations:
      required: false

  - type: textarea
    id: evidence
    attributes:
      label: 로그 / 스크린샷
      description: secret 또는 개인정보는 제거해주세요.
    validations:
      required: false
